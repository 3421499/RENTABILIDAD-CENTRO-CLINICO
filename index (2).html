<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#0F6E56"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Mi Centro"/>
<link rel="manifest" href="manifest.json"/>
<title>Mi Centro — Utilidad</title>
<style>
:root {
  --green: #0F6E56; --green-light: #E1F5EE; --green-dark: #085041;
  --red: #A32D2D; --red-light: #FCEBEB;
  --blue: #185FA5; --blue-light: #E6F1FB;
  --purple: #3C3489; --purple-light: #EEEDFE;
  --amber: #854F0B; --amber-light: #FAEEDA;
  --bg: #F8F7F4; --surface: #FFFFFF;
  --border: rgba(0,0,0,0.10); --border-mid: rgba(0,0,0,0.18);
  --text: #1A1A18; --text-muted: #6B6B66; --text-hint: #9B9B95;
  --radius: 10px; --radius-lg: 14px;
  --shadow: 0 1px 4px rgba(0,0,0,0.07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111110; --surface: #1C1C1A;
    --border: rgba(255,255,255,0.10); --border-mid: rgba(255,255,255,0.18);
    --text: #F0EFE8; --text-muted: #9B9B95; --text-hint: #6B6B66;
    --green-light: #04342C; --red-light: #501313;
    --blue-light: #042C53; --purple-light: #26215C; --amber-light: #412402;
    --shadow: 0 1px 4px rgba(0,0,0,0.35);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; min-height: 100dvh; }

/* LOGIN */
#login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100dvh; padding: 32px 24px; text-align: center; }
#login-screen .logo { font-size: 52px; margin-bottom: 16px; }
#login-screen h1 { font-size: 26px; font-weight: 700; color: var(--green); margin-bottom: 6px; }
#login-screen p { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; }
.btn-google { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 0.5px solid var(--border-mid); border-radius: 12px; padding: 14px 24px; font-size: 16px; font-weight: 500; cursor: pointer; color: var(--text); box-shadow: var(--shadow); }
.btn-google:active { transform: scale(0.97); }
.btn-google svg { width: 22px; height: 22px; }

/* LOADING */
#loading-screen { display: flex; align-items: center; justify-content: center; min-height: 100dvh; flex-direction: column; gap: 12px; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border-mid); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* APP */
#app-screen { display: none; }
.topbar { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-title { font-size: 17px; font-weight: 700; color: var(--green); letter-spacing: -0.3px; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.user-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--border-mid); cursor: pointer; }
.user-avatar-placeholder { width: 30px; height: 30px; border-radius: 50%; background: var(--green-light); color: var(--green); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--border-mid); }
.btn-icon { background: none; border: 0.5px solid var(--border-mid); border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); font-size: 17px; }
.btn-icon:active { background: var(--bg); transform: scale(0.95); }

.month-nav { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
.month-display { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }

.tabs { display: flex; background: var(--surface); border-bottom: 0.5px solid var(--border); overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; padding: 12px 16px; font-size: 14px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; user-select: none; }
.tab.active { color: var(--green); border-bottom-color: var(--green); }

.content { padding: 16px; max-width: 680px; margin: 0 auto; }
.pb-safe { padding-bottom: max(16px, env(safe-area-inset-bottom, 16px)); }

/* CARDS */
.card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow); }
.card-head { padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid var(--border); }
.card-title { font-size: 15px; font-weight: 600; }
.card-subtotal { font-size: 13px; font-weight: 600; color: var(--text-muted); }
.category-section { padding: 10px 16px 4px; }

.entry { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 0.5px solid var(--border); }
.entry:last-child { border-bottom: none; }
.entry input { background: transparent; border: none; outline: none; color: var(--text); font-size: 14px; padding: 2px 0; width: 100%; }
.entry input::placeholder { color: var(--text-hint); }
.entry input[type=number] { text-align: right; width: 110px; }
.entry-delete { background: none; border: none; color: var(--text-hint); cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 18px; line-height: 1; }
.entry-delete:active { background: var(--red-light); color: var(--red); }

.btn-add-entry { display: flex; align-items: center; gap: 6px; padding: 9px 4px; font-size: 13px; color: var(--blue); background: none; border: none; cursor: pointer; width: 100%; }
.btn-add-entry:active { opacity: 0.6; }

/* SUMMARY */
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.metric-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
.metric-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-hint); margin-bottom: 4px; }
.metric-value { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.green { color: var(--green); } .red { color: var(--red); } .neutral { color: var(--text); }

.result-card { background: var(--green); border-radius: var(--radius-lg); padding: 18px; color: #fff; margin-bottom: 12px; }
.result-card.red-bg { background: var(--red); }
.result-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; opacity: 0.85; }
.result-total { display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 10px; margin-top: 8px; font-size: 18px; font-weight: 700; }

/* HISTORY */
.history-month { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: var(--shadow); }
.history-month:active { background: var(--bg); }
.history-name { font-size: 15px; font-weight: 500; }
.history-detail { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.history-util { font-size: 16px; font-weight: 700; }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-width: 680px; max-height: 80dvh; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0); }
.modal-handle { width: 36px; height: 4px; background: var(--border-mid); border-radius: 2px; margin: 12px auto 16px; }
.modal-title { font-size: 17px; font-weight: 600; padding: 0 20px 12px; }
.modal-section { padding: 0 20px 16px; }
.modal-section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-hint); margin-bottom: 10px; }
.cat-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 0.5px solid var(--border-mid); border-radius: 20px; padding: 5px 10px 5px 12px; font-size: 13px; margin: 0 6px 6px 0; }
.cat-chip-del { background: none; border: none; cursor: pointer; color: var(--text-hint); font-size: 16px; padding: 0; line-height: 1; }
.cat-chip-del:active { color: var(--red); }
.new-cat-row { display: flex; gap: 8px; margin-top: 10px; }
.new-cat-row input { flex: 1; border: 0.5px solid var(--border-mid); border-radius: 8px; padding: 9px 12px; background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
.new-cat-row input:focus { border-color: var(--green); }
.btn-primary { background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn-primary:active { background: var(--green-dark); }
.btn-ghost { background: none; border: 0.5px solid var(--border-mid); border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer; color: var(--text); }

/* SAVING INDICATOR */
.saving-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-hint); display: inline-block; transition: background 0.3s; }
.saving-dot.saving { background: var(--amber); animation: pulse 1s infinite; }
.saving-dot.saved { background: var(--green); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.empty { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-sub { font-size: 13px; color: var(--text-hint); margin-top: 4px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" style="display:none">
  <div class="logo">📊</div>
  <h1>Mi Centro</h1>
  <p>Control de ingresos y gastos<br>de tu centro</p>
  <button class="btn-google" onclick="signInWithGoogle()">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Entrar con Google
  </button>
</div>

<!-- LOADING -->
<div id="loading-screen">
  <div class="spinner"></div>
  <span style="color:var(--text-muted);font-size:14px">Cargando...</span>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="topbar">
    <span class="topbar-title">📊 Mi Centro</span>
    <div class="topbar-right">
      <span class="saving-dot" id="saving-dot" title="Estado de guardado"></span>
      <button class="btn-icon" onclick="openCatModal()" title="Categorías">⚙️</button>
      <div id="user-avatar-wrap"></div>
    </div>
  </div>

  <div class="month-nav">
    <button class="btn-icon" onclick="changeMonth(-1)" aria-label="Mes anterior">‹</button>
    <span class="month-display" id="month-display"></span>
    <button class="btn-icon" onclick="changeMonth(1)" aria-label="Mes siguiente">›</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="setTab('resumen')">Resumen</div>
    <div class="tab" onclick="setTab('ingresos')">Ingresos</div>
    <div class="tab" onclick="setTab('gastos')">Gastos</div>
    <div class="tab" onclick="setTab('historial')">Historial</div>
  </div>

  <div class="content pb-safe" id="main-content">
    <div class="empty"><div class="spinner" style="margin:0 auto"></div></div>
  </div>
</div>

<!-- MODAL CATEGORÍAS -->
<div class="modal-overlay" id="cat-modal" onclick="closeCatModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Gestionar categorías</div>
    <div id="modal-body"></div>
    <div style="padding:0 20px 24px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn-ghost" onclick="closeCatModal()">Cerrar</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, onSnapshot }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ── CONFIG — reemplaza con los valores de tu proyecto Firebase ──────────────
const firebaseConfig = {
  apiKey: "AIzaSyDPJ3VrNvedaojIpJuleGOAeRcUZ-dTOlg",
  authDomain: "utilidad-centro-clinico.firebaseapp.com",
  projectId: "utilidad-centro-clinico",
  storageBucket: "utilidad-centro-clinico.firebasestorage.app",
  messagingSenderId: "886383231385",
  appId: "1:886383231385:web:2fd56dc94dd0e283789308"
};
// ────────────────────────────────────────────────────────────────────────────

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

let currentUser = null;
let currentYear  = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let activeTab    = 'resumen';
let saveTimer    = null;
let unsubHistory = null;

const MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DEFAULT_CATS = {
  ingresos: ['Efectivo','Tarjeta','Transferencia'],
  gastos:   ['Sueldos','Arriendo','Gastos generales']
};

// ── AUTH ────────────────────────────────────────────────────────────────────
window.signInWithGoogle = async () => {
  const provider = new GoogleAuthProvider();
  try { await signInWithPopup(auth, provider); } catch(e) { console.error(e); }
};
window.doSignOut = async () => {
  if (!confirm('¿Cerrar sesión?')) return;
  if (unsubHistory) unsubHistory();
  await signOut(auth);
};

onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    showApp(user);
  } else {
    currentUser = null;
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('login-screen').style.display  = 'flex';
    document.getElementById('app-screen').style.display    = 'none';
  }
});

function showApp(user) {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('login-screen').style.display  = 'none';
  document.getElementById('app-screen').style.display    = 'block';

  const wrap = document.getElementById('user-avatar-wrap');
  if (user.photoURL) {
    wrap.innerHTML = `<img src="${user.photoURL}" class="user-avatar" onclick="doSignOut()" title="Cerrar sesión" referrerpolicy="no-referrer"/>`;
  } else {
    const initials = (user.displayName || user.email || 'U').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    wrap.innerHTML = `<div class="user-avatar-placeholder" onclick="doSignOut()" title="Cerrar sesión">${initials}</div>`;
  }
  render();
  subscribeHistory();
}

// ── FIRESTORE PATHS ─────────────────────────────────────────────────────────
function userDoc(...segments) {
  return doc(db, 'users', currentUser.uid, ...segments);
}
function monthKey(y, m) { return `${y}_${String(m+1).padStart(2,'0')}`; }

// ── CATEGORIES ──────────────────────────────────────────────────────────────
async function loadCategories() {
  try {
    const snap = await getDoc(userDoc('config', 'categories'));
    return snap.exists() ? snap.data() : JSON.parse(JSON.stringify(DEFAULT_CATS));
  } catch { return JSON.parse(JSON.stringify(DEFAULT_CATS)); }
}
async function saveCategories(cats) {
  await setDoc(userDoc('config', 'categories'), cats);
}

// ── MONTH DATA ───────────────────────────────────────────────────────────────
async function loadMonth(y, m) {
  try {
    const snap = await getDoc(userDoc('months', monthKey(y, m)));
    if (snap.exists()) return snap.data();
  } catch {}
  const cats = await loadCategories();
  const data = { ingresos: {}, gastos: {} };
  cats.ingresos.forEach(c => data.ingresos[c] = []);
  cats.gastos.forEach(c => data.gastos[c] = []);
  return data;
}

function scheduleSave(data) {
  setSaving('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await setDoc(userDoc('months', monthKey(currentYear, currentMonth)), data);
      setSaving('saved');
      setTimeout(() => setSaving('idle'), 2000);
    } catch(e) { console.error('Error guardando:', e); setSaving('idle'); }
  }, 800);
}

function setSaving(state) {
  const dot = document.getElementById('saving-dot');
  if (!dot) return;
  dot.className = 'saving-dot' + (state === 'saving' ? ' saving' : state === 'saved' ? ' saved' : '');
  dot.title = state === 'saving' ? 'Guardando...' : state === 'saved' ? 'Guardado ✓' : '';
}

// ── HISTORY SUBSCRIPTION ────────────────────────────────────────────────────
function subscribeHistory() {
  if (unsubHistory) unsubHistory();
  const col = collection(db, 'users', currentUser.uid, 'months');
  unsubHistory = onSnapshot(col, () => {
    if (activeTab === 'historial') render();
  });
}

// ── NAVIGATION ───────────────────────────────────────────────────────────────
window.changeMonth = (d) => {
  currentMonth += d;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  render();
};
window.setTab = (tab) => {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', i === ['resumen','ingresos','gastos','historial'].indexOf(tab));
  });
  render();
};
window.goToMonth = (y, m) => { currentYear = y; currentMonth = m; setTab('resumen'); };

// ── RENDER ───────────────────────────────────────────────────────────────────
async function render() {
  document.getElementById('month-display').textContent =
    MONTH_NAMES[currentMonth] + ' ' + currentYear;
  const el = document.getElementById('main-content');
  el.innerHTML = `<div class="empty"><div class="spinner" style="margin:0 auto"></div></div>`;

  if (activeTab === 'resumen')   el.innerHTML = await renderResumen();
  if (activeTab === 'ingresos')  el.innerHTML = await renderIngresos();
  if (activeTab === 'gastos')    el.innerHTML = await renderGastos();
  if (activeTab === 'historial') el.innerHTML = await renderHistorial();
}

function fmt(n) { return '$' + Math.round(n).toLocaleString('es-CL'); }
function sumEntries(arr) { return (arr||[]).reduce((s,e) => s + (parseFloat(e.amount)||0), 0); }
function totalIngresos(data) { return Object.values(data.ingresos||{}).reduce((s,a) => s+sumEntries(a), 0); }
function totalGastos(data)   { return Object.values(data.gastos||{}).reduce((s,a)   => s+sumEntries(a), 0); }

async function renderResumen() {
  const [data, cats] = await Promise.all([loadMonth(currentYear, currentMonth), loadCategories()]);
  const ing  = totalIngresos(data);
  const gas  = totalGastos(data);
  const util = ing - gas;
  const margen = ing > 0 ? (util / ing * 100) : null;
  const isPos = util >= 0;

  let ingRows = cats.ingresos.map(c => {
    const s = sumEntries(data.ingresos[c]||[]);
    return s > 0 ? `<div class="result-row"><span>${esc(c)}</span><span>${fmt(s)}</span></div>` : '';
  }).join('');
  let gasRows = cats.gastos.map(c => {
    const s = sumEntries(data.gastos[c]||[]);
    return s > 0 ? `<div class="result-row"><span>${esc(c)}</span><span>${fmt(s)}</span></div>` : '';
  }).join('');
  if (!ingRows) ingRows = `<div class="result-row"><span style="opacity:.6">Sin ingresos</span><span>$0</span></div>`;
  if (!gasRows) gasRows = `<div class="result-row"><span style="opacity:.6">Sin gastos</span><span>$0</span></div>`;

  return `
    <div class="summary-grid">
      <div class="metric-card"><div class="metric-label">Ingresos</div><div class="metric-value green">${fmt(ing)}</div></div>
      <div class="metric-card"><div class="metric-label">Gastos</div><div class="metric-value red">${fmt(gas)}</div></div>
      <div class="metric-card"><div class="metric-label">Utilidad</div><div class="metric-value ${isPos?'green':'red'}">${fmt(util)}</div></div>
      <div class="metric-card"><div class="metric-label">Margen</div><div class="metric-value neutral">${margen!==null?margen.toFixed(1)+'%':'—'}</div></div>
    </div>
    <div class="result-card ${isPos?'':'red-bg'}">
      ${ingRows}
      <div class="result-row" style="opacity:.4;font-size:11px;padding-top:6px">— gastos —</div>
      ${gasRows}
      <div class="result-total"><span>Utilidad ${MONTH_NAMES[currentMonth]}</span><span>${fmt(util)}</span></div>
    </div>`;
}

async function renderSection(section) {
  const [data, cats] = await Promise.all([loadMonth(currentYear, currentMonth), loadCategories()]);
  if (!cats[section].length)
    return `<div class="empty"><div class="empty-icon">💡</div><p>Sin categorías</p><div class="empty-sub">Agrégalas en ⚙️</div></div>`;

  return cats[section].map(cat => {
    const entries = data[section][cat] || [];
    const sub = sumEntries(entries);
    const rows = entries.map((e, i) => `
      <div class="entry">
        <input type="text" placeholder="Descripción" value="${esc(e.desc||'')}"
          oninput="updateEntry('${section}','${escAttr(cat)}',${i},'desc',this.value)"/>
        <input type="number" min="0" step="1" placeholder="0" value="${e.amount||''}"
          oninput="updateEntry('${section}','${escAttr(cat)}',${i},'amount',this.value)"/>
        <button class="entry-delete" onclick="deleteEntry('${section}','${escAttr(cat)}',${i})">×</button>
      </div>`).join('');
    return `
      <div class="card">
        <div class="card-head">
          <div class="card-title">${esc(cat)}</div>
          <div class="card-subtotal" id="sub-${section}-${escAttr(cat)}">${fmt(sub)}</div>
        </div>
        <div class="category-section">
          ${rows}
          <button class="btn-add-entry" id="addbtn-${section}-${escAttr(cat)}" onclick="addEntry('${section}','${escAttr(cat)}')">＋ Agregar registro</button>
        </div>
      </div>`;
  }).join('');
}
async function renderIngresos() { return renderSection('ingresos'); }
async function renderGastos()   { return renderSection('gastos'); }

async function renderHistorial() {
  try {
    const col = collection(db, 'users', currentUser.uid, 'months');
    const snap = await getDocs(col);
    if (snap.empty) return `<div class="empty"><div class="empty-icon">📅</div><p>Sin historial aún</p><div class="empty-sub">Registra datos de un mes para verlos aquí</div></div>`;
    const months = snap.docs.map(d => {
      const [y, mm] = d.id.split('_');
      return { year: parseInt(y), month: parseInt(mm)-1, data: d.data() };
    }).sort((a,b) => b.year!==a.year ? b.year-a.year : b.month-a.month);
    return months.map(({ year, month, data }) => {
      const ing  = totalIngresos(data);
      const gas  = totalGastos(data);
      const util = ing - gas;
      const isPos = util >= 0;
      return `<div class="history-month" onclick="goToMonth(${year},${month})">
        <div>
          <div class="history-name">${MONTH_NAMES[month]} ${year}</div>
          <div class="history-detail">Ingresos ${fmt(ing)} · Gastos ${fmt(gas)}</div>
        </div>
        <div style="text-align:right">
          <div class="history-util" style="color:${isPos?'var(--green)':'var(--red)'}">${fmt(util)}</div>
          <div class="history-detail">${isPos?'✓ positivo':'✗ negativo'}</div>
        </div>
      </div>`;
    }).join('');
  } catch(e) { return `<div class="empty"><p>Error cargando historial</p></div>`; }
}

// ── DATA OPS ─────────────────────────────────────────────────────────────────
window.addEntry = async (section, cat) => {
  const data = await loadMonth(currentYear, currentMonth);
  if (!data[section][cat]) data[section][cat] = [];
  const idx = data[section][cat].length;
  data[section][cat].push({ desc: '', amount: '' });
  scheduleSave(data);

  // Inject row directly into DOM — no full re-render
  const catKey = cat.replace(/'/g, "\\'");
  const btnId = `addbtn-${section}-${CSS.escape(cat)}`;
  const btn = document.getElementById(btnId);
  if (btn) {
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `
      <input type="text" placeholder="Descripción"
        oninput="updateEntry('${section}','${catKey}',${idx},'desc',this.value)"/>
      <input type="number" min="0" step="1" placeholder="0"
        oninput="updateEntry('${section}','${catKey}',${idx},'amount',this.value)"/>
      <button class="entry-delete" onclick="deleteEntry('${section}','${catKey}',${idx})">×</button>`;
    btn.parentNode.insertBefore(div, btn);
    div.querySelector('input[type=text]').focus();
  } else {
    await render();
    setTimeout(() => {
      const inputs = document.querySelectorAll('.entry input[type=text]');
      if (inputs.length) inputs[inputs.length-1].focus();
    }, 60);
  }
};
window.updateEntry = async (section, cat, idx, field, val) => {
  const data = await loadMonth(currentYear, currentMonth);
  if (data[section][cat]?.[idx] !== undefined) {
    data[section][cat][idx][field] = val;
    scheduleSave(data);
    const sub = sumEntries(data[section][cat]);
    const subEl = document.getElementById(`sub-${section}-${cat}`);
    if (subEl) subEl.textContent = fmt(sub);
  }
};
window.deleteEntry = async (section, cat, idx) => {
  const data = await loadMonth(currentYear, currentMonth);
  if (data[section][cat]) {
    data[section][cat].splice(idx, 1);
    scheduleSave(data);
    render();
  }
};

// ── CATEGORY MODAL ────────────────────────────────────────────────────────────
window.openCatModal = async () => {
  await renderModalBody();
  document.getElementById('cat-modal').classList.add('open');
};
window.closeCatModal = (e) => {
  if (!e || e.target.id === 'cat-modal') {
    document.getElementById('cat-modal').classList.remove('open');
    render();
  }
};
async function renderModalBody() {
  const cats = await loadCategories();
  const sections = [
    { key: 'ingresos', label: 'Categorías de ingresos' },
    { key: 'gastos',   label: 'Categorías de gastos'   }
  ];
  document.getElementById('modal-body').innerHTML = sections.map(({key, label}) => `
    <div class="modal-section">
      <div class="modal-section-title">${label}</div>
      <div id="chips-${key}">
        ${cats[key].map((c,i) => `
          <span class="cat-chip">${esc(c)}
            <button class="cat-chip-del" onclick="deleteCat('${key}',${i})">×</button>
          </span>`).join('') || '<span style="color:var(--text-hint);font-size:13px">Sin categorías</span>'}
      </div>
      <div class="new-cat-row">
        <input type="text" id="new-cat-${key}" placeholder="Nueva categoría..."
          onkeydown="if(event.key==='Enter')addCat('${key}')"/>
        <button class="btn-primary" onclick="addCat('${key}')">Agregar</button>
      </div>
    </div>`).join('');
}
window.addCat = async (section) => {
  const inp  = document.getElementById('new-cat-' + section);
  const name = inp.value.trim();
  if (!name) return;
  const cats = await loadCategories();
  if (!cats[section].includes(name)) {
    cats[section].push(name);
    await saveCategories(cats);
    const data = await loadMonth(currentYear, currentMonth);
    if (!data[section][name]) data[section][name] = [];
    scheduleSave(data);
  }
  inp.value = '';
  await renderModalBody();
};
window.deleteCat = async (section, idx) => {
  const cats = await loadCategories();
  cats[section].splice(idx, 1);
  await saveCategories(cats);
  await renderModalBody();
};

// ── UTILS ─────────────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s).replace(/'/g,"\\'"); }

// ── PWA ───────────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
